name: Deploy to FTP hosting

# Builds the site and uploads dist/ to any hosting that speaks FTP/FTPS (WEDOS, etc.). This is the site's deploy.
# Set these in Settings -> Secrets and variables -> Actions. Nothing is stored in the repo.
#   secret   FTP_SERVER     host name, e.g. 123456.w78.wedos.net
#   secret   FTP_USERNAME
#   secret   FTP_PASSWORD
#   variable FTP_DIR        folder to upload into, ending with "/" (default: www/)
# Files that are not part of the build are never deleted: the action only removes files it uploaded itself.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ftp-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ftp:
    runs-on: ubuntu-latest
    steps:
      - name: Check the FTP secrets are configured
        env:
          SERVER: ${{ secrets.FTP_SERVER }}
          USER: ${{ secrets.FTP_USERNAME }}
          PASS: ${{ secrets.FTP_PASSWORD }}
        run: '[ -n "$SERVER" ] && [ -n "$USER" ] && [ -n "$PASS" ] || { echo "::error::Add the FTP_SERVER, FTP_USERNAME and FTP_PASSWORD secrets (see comment at top of this file)"; exit 1; }'
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      # pinned to a commit: this action gets the FTP password, and a tag can be moved
      - uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps # explicit FTPS on port 21, which WEDOS recommends
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_DIR || 'www/' }}
